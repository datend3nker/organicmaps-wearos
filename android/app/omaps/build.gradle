plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'androidx.baselineprofile'
}

android {
    namespace 'app.organicmaps.wear'
    compileSdk 36

    defaultConfig {
        applicationId "app.organicmaps"
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName "1.0"

        multiDexEnabled true
    }

    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword '12345678'
            keyAlias 'debug'
            keyPassword '12345678'
        }
    }

    flavorDimensions = ['default']
    productFlavors {
        oss {
            dimension 'default'
        }
        google {
            dimension 'default'
        }
        fdroid {
            dimension 'default'
        }
    }

    tasks.register('deployWatchOss') {
        dependsOn 'assembleOssDebug'
        doLast {
            def serial = "emulator-5556"
            def apk = "build/outputs/apk/oss/debug/omaps-oss-debug.apk"
            exec { commandLine "adb", "-s", serial, "uninstall", "app.organicmaps.debug" }
            exec { commandLine "adb", "-s", serial, "install", apk }
            exec { commandLine "adb", "-s", serial, "shell", "pm", "grant", "app.organicmaps.debug", "android.permission.BLUETOOTH_CONNECT" }
            exec { commandLine "adb", "-s", serial, "shell", "pm", "grant", "app.organicmaps.debug", "android.permission.BLUETOOTH_SCAN" }
            exec { commandLine "adb", "-s", serial, "shell", "pm", "grant", "app.organicmaps.debug", "android.permission.ACCESS_FINE_LOCATION" }
            exec { commandLine "adb", "-s", serial, "shell", "am", "start", "-n", "app.organicmaps.debug/app.organicmaps.wear.presentation.Omaps" }
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
        google {
            java.srcDirs = ['src/gms/java']
            res.srcDirs = ['src/gms/res']
            manifest.srcFile 'src/gms/AndroidManifest.xml'
        }
        fdroid {
            java.srcDirs = ['src/gms/java']
            res.srcDirs = ['src/gms/res']
            manifest.srcFile 'src/gms/AndroidManifest.xml'
        }
        oss {
            java.srcDirs = ['src/oss/java']
        }
    }

    tasks.register('copyAssets', Copy) {
        from "../../../data"
        include "countries.txt"
        include "countries-strings/**"
        include "sound-strings/**"
        include "categories.txt"
        include "classificator.txt"
        include "types.txt"
        include "packed_polygons.bin"
        include "drules_proto*.bin"
        include "resources-*.bin"
        include "World.mwm"
        include "WorldCoasts.mwm"
        include "symbols/**"
        include "vulkan_shaders/**"
        include "fonts/**"
        include "styles/**"
        include "transit_colors.txt"
        include "colors.txt"
        into "src/main/assets"
    }

    preBuild.dependsOn 'copyAssets'

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign release with the checked-in debug key so the sideload CI release APKs are
            // installable (matches the phone module). Not for Play distribution.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }

    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.DS_Store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~'
        noCompress = ['txt', 'bin', 'html', 'png', 'json', 'mwm', 'ttf', 'sdf', 'ui', 'config', 'csv', 'spv', 'obj']
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation project(':sdk')
    
    // Google & F-Droid (MicroG) share the GMS Wearable API
    googleImplementation 'com.google.android.gms:play-services-wearable:19.0.0'
    googleImplementation 'com.google.android.gms:play-services-location:21.0.1'
    googleImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'

    fdroidImplementation 'com.google.android.gms:play-services-wearable:19.0.0'
    fdroidImplementation 'com.google.android.gms:play-services-location:21.0.1'
    fdroidImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'
    
    // OSS: Pure standalone, no GMS/MicroG dependencies
    
    implementation platform('androidx.compose:compose-bom:2025.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    
    implementation 'androidx.compose.material:material-icons-core:1.7.8'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    
    implementation 'androidx.wear.compose:compose-material:1.5.0'
    implementation 'androidx.wear.compose:compose-foundation:1.5.0'
    implementation 'androidx.wear.compose:compose-navigation:1.5.0'
    
    implementation 'androidx.wear:wear:1.4.0'
    implementation 'androidx.wear:wear-input:1.2.0'
    implementation 'androidx.wear.tiles:tiles:1.6.0'
    implementation 'androidx.wear.tiles:tiles-material:1.6.0'
    implementation 'androidx.wear.protolayout:protolayout:1.4.0'
    implementation 'androidx.wear.protolayout:protolayout-material:1.4.0'
    implementation 'com.google.guava:guava:33.6.0-android' // Use android version
    implementation 'androidx.wear.watchface:watchface-complications-data:1.3.0'
    implementation 'androidx.wear.watchface:watchface-complications-data-source-ktx:1.3.0'
    
    implementation 'androidx.wear:wear-remote-interactions:1.1.0'
    implementation 'androidx.wear:wear-tooling-preview:1.0.0'
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.10.0'
    implementation 'androidx.preference:preference:1.2.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    baselineProfile project(':baselineprofile')
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
}

baselineProfile {
    saveInSrc = true
}
