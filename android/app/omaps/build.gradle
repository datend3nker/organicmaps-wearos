plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'app.organicmaps.wear'
    compileSdk 36

    defaultConfig {
        applicationId "app.organicmaps"
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword '12345678'
            keyAlias 'debug'
            keyPassword '12345678'
        }
    }

    flavorDimensions = ['default']
    productFlavors {
        google {
            dimension 'default'
        }
        fdroid {
            dimension 'default'
        }
        oss {
            dimension 'default'
        }
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
        google {
            java.srcDirs = ['src/google/java', 'src/gms/java']
            manifest.srcFile 'src/gms/AndroidManifest.xml'
        }
        fdroid {
            java.srcDirs = ['src/google/java', 'src/gms/java']
        }
        oss {
            java.srcDirs = ['src/oss/java']
        }
    }

    tasks.register('copyAssets', Copy) {
        from "../../../data"
        include "countries.txt"
        include "countries-strings/**"
        include "sound-strings/**"
        include "categories.txt"
        include "classificator.txt"
        include "types.txt"
        include "packed_polygons.bin"
        include "drules_proto*.bin"
        into "src/main/assets"
    }

    preBuild.dependsOn 'copyAssets'

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }

    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.DS_Store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~'
        noCompress = ['txt', 'bin', 'html', 'png', 'json', 'mwm', 'ttf', 'sdf', 'ui', 'config', 'csv', 'spv', 'obj']
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation project(':sdk')
    
    // Google & F-Droid (MicroG) share the GMS Wearable API
    googleImplementation 'com.google.android.gms:play-services-wearable:19.0.0'
    googleImplementation 'com.google.android.gms:play-services-location:21.0.1'
    googleImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'

    fdroidImplementation 'com.google.android.gms:play-services-wearable:19.0.0'
    fdroidImplementation 'com.google.android.gms:play-services-location:21.0.1'
    fdroidImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'
    
    // OSS: Pure standalone, no GMS/MicroG dependencies
    
    implementation platform('androidx.compose:compose-bom:2025.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    
    implementation 'androidx.compose.material:material-icons-core:1.7.8'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    
    implementation 'androidx.wear.compose:compose-material:1.5.0'
    implementation 'androidx.wear.compose:compose-foundation:1.5.0'
    implementation 'androidx.wear.compose:compose-navigation:1.5.0'
    
    implementation 'androidx.wear:wear-tooling-preview:1.0.0'
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
